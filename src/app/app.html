@if (healthStatus() === 'available') {
  <router-outlet />
} @else if (healthStatus() === 'unavailable') {
  <div class="service-page" aria-labelledby="service-title">
      <svg class="service-icon service-icon-alert" viewBox="0 0 48 48" aria-hidden="true">
        <path d="M24 5.5 42.5 39H5.5L24 5.5Z" />
        <path d="M24 18v9m0 6h.02" />
      </svg>
      <p class="service-label" role="status">Temporary connection issue</p>
      <h1 id="service-title">Your workspace is taking a break</h1>
      <p class="service-copy">
        We’re sorry for the interruption. Your request hasn’t gone through yet. Please try again;
        if the problem continues, your administrator can help.
      </p>
      <button class="retry-button" type="button" (click)="retryHealthCheck()">
        <span>Try again</span>
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M16 10a6 6 0 1 1-1.76-4.24M16 4v4h-4" />
        </svg>
      </button>
  </div>
}
